name: 공모주 일정 자동 갱신

on:
  schedule:
    # 한국 시간 08:00, 12:30, 18:00 (평일)
    - cron: "0 23 * * 0-4"
    - cron: "30 3 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DART 공시 확인
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update.py
      - name: 바뀐 내용 저장
        run: |
          if git diff --quiet data.json; then
            echo "바뀐 내용 없음"
          else
            git config user.name "gongmo-bot"
            git config user.email "gongmo-bot@users.noreply.github.com"
            git add data.json
            git commit -m "공모주 일정 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
